name: 💡 Предложить фичу
description: У вас есть идея для улучшения?
title: "Feature: "
labels: type:feature, feature, minor
assignees: DivinMA
body:
  - type: markdown
    attributes:
      value: |
        Спасибо за идею! Расскажите, что вы хотите добавить.

        💡 Подсказка:
        - Лейбл `minor` будет добавлен автоматически при создании PR с веткой `feat/...`
        - Если есть обратная несовместимость — добавьте `major`

  - type: textarea
    attributes:
      label: Описание
      description: Что вы хотите добавить?
    validations:
      required: true

  - type: textarea
    attributes:
      label: Мотивация
      description: Зачем это нужно? Где пригодится?
    validations:
      required: true

  - type: textarea
    attributes:
      label: Пример использования
      placeholder: |
        ```fsharp
        toWordsEng 21_000L 0L
        // → "twenty-one thousand dollars"
        ```
    validations:
      required: true

  - type: textarea
    attributes:
      label: Альтернативы
      description: Были ли другие варианты? Почему выбран этот?

  - type: dropdown
    attributes:
      label: Приоритет
      description: Насколько важно это изменение?
      options:
        - Не знаю (оставьте по умолчанию)
        - priority:low
        - priority:medium
        - priority:high
        - priority:critical
    validations:
      required: false

  - type: dropdown
    attributes:
      label: Оценка сложности
      description: Сколько времени займёт реализация?
      options:
        - Не знаю
        - effort:small (1-2 часа)
        - effort:medium (1 день)
        - effort:large (2+ дня)
        - effort:huge (неделя+)
    validations:
      required: false
