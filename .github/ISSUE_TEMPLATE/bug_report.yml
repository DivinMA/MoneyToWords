name: 🐞 Сообщить об ошибку
description: Опишите баг, который вы нашли
title: "Bug: "
labels: type:bug, fix, patch
assignees: DivinMA
body:
  - type: markdown
    attributes:
      value: |
        Спасибо, что помогаете улучшать проект!

        Пожалуйста, заполните форму — это поможет быстрее разобраться.

        💡 Подсказка:
        - Лейбл `patch` будет добавлен автоматически при создании PR с веткой `fix/...`
        - Если баг критичный — мейнтейнер добавит `priority:critical`

  - type: textarea
    attributes:
      label: Описание
      description: Что пошло не так?
    validations:
      required: true

  - type: textarea
    attributes:
      label: Шаги воспроизведения
      value: |
        1. 
        2. 
        3.
    validations:
      required: true

  - type: textarea
    attributes:
      label: Ожидаемое поведение
    validations:
      required: true

  - type: textarea
    attributes:
      label: Фактическое поведение
    validations:
      required: true

  - type: input
    attributes:
      label: Версия библиотеки
      placeholder: например, 1.0.0
    validations:
      required: true

  - type: input
    attributes:
      label: .NET версия
      placeholder: например, 10.0 или выше
    validations:
      required: true

  - type: textarea
    attributes:
      label: Пример кода (если есть)
      placeholder: |
        ```fsharp
        toWords 1001L 0L
        ```
