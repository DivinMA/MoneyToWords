# .github/dependabot.yml
version: 2

updates:
  # 1. NuGet-пакеты
  - package-ecosystem: "nuget"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "04:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 5
    versioning-strategy: "lockfile-only"
    ignore:
      # Игнорировать бета-, превью-, RC-версии
      - dependency-name: "FsCheck"
        versions:
          - "3.*-beta*"
          - "3.*-rc*"
          - "3.*-preview*"
      - dependency-name: "xunit*"
        versions:
          - "3.*-beta*"
          - "3.*-rc*"
          - "3.*-preview*"
      # Не обновлять FSharp.Core до новой мажорной версии автоматически
      - dependency-name: "FSharp.Core"
        update-types: ["version-update:semver-major"]

  # 2. GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "03:00"
      timezone: Etc/UTC
    ignore:
      # Игнорировать бета-версии экшенов (если нужно)
      - dependency-name: "actions/*"
        versions:
          - "*-beta"
          - "*-rc"
          - "*-preview"
