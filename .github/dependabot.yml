# .github/dependabot.yml
version: 2

updates:
  # 1. NuGet-пакеты
  - package-ecosystem: "nuget"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "04:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 5
    # versioning-strategy: "lockfile-only"  # ❌ Удалено — не нужно в v2

    ignore:
      # Игнорировать ВСЕ бета-, превью-, RC-версии (глобально)
      - dependency-name: "*"
        versions:
          - "*-beta*"
          - "*-rc*"
          - "*-preview*"
          - "*-alpha*"

      # Не обновлять FSharp.Core до новой мажорной версии автоматически
      - dependency-name: "FSharp.Core"
        update-types: ["version-update:semver-major"]

      # При необходимости — исключить другие пакеты
      # - dependency-name: "Microsoft.SourceLink.GitHub"
      #   update-types: ["version-update:semver-major"]

  # 2. GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "03:00"
      timezone: Etc/UTC
    ignore:
      # Игнорировать бета-версии экшенов
      - dependency-name: "actions/*"
        versions:
          - "*-beta"
          - "*-rc"
          - "*-preview"
