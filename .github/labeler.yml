# .github/labeler.yml
# Автоматическое проставление меток
# Основано на ветке и файлах
# Единый источник правды — labels.json

# 🔹 Версионирование
"patch":
  - head-branch: ["^fix/", "^hotfix/", "^chore/", "^docs/", "^style/", "^refactor/", "patch"]
  - changed-files:
      - any-glob-to-any-file: "**/*.md"
      - any-glob-to-any-file: "docs/**/*"

"minor":
  - head-branch: ["^feat/", "^feature/", "^enhancement/"]

"major":
  - head-branch: ["^breaking/", "major", "^remove/", "v2"]
  - changed-files:
      - any-glob-to-any-file: "public-api.txt"

# 🔹 Области кода
"area:core":
  - changed-files:
      - any-glob-to-any-file: "src/MoneyToWords/**/*"

"area:tests":
  - changed-files:
      - any-glob-to-any-file: "tests/**/*"

"area:examples":
  - changed-files:
      - any-glob-to-any-file: "examples/**/*"

"area:ci":
  - changed-files:
      - any-glob-to-any-file: ".github/workflows/**/*"
      - any-glob-to-any-file: ".github/scripts/*.fsx"
      - any-glob-to-any-file: ".github/config/labels.json"
      - any-glob-to-any-file: "package.json"
      - any-glob-to-any-file: "Directory.Build.props"
      - any-glob-to-any-file: "dotnet-tools.json"
      - any-glob-to-any-file: "build.fsx"  # если появится — покрыто

"area:docs":
  - changed-files:
      - any-glob-to-any-file: "docs/**/*"
      - any-glob-to-any-file: "README.md"
      - any-glob-to-any-file: "CONTRIBUTING.md"

# 🔹 Типы задач
"type:feature":
  - head-branch: ["^feat/", "^feature/", "^enhancement/"]
  - changed-files:
      - any-glob-to-any-file: "src/**/*"

"type:bug":
  - head-branch: ["^fix/", "bugfix", "^hotfix/"]
  - changed-files:
      - any-glob-to-any-file: "src/**/*.fs"
      - any-glob-to-any-file: "src/**/*.fsx"
      - any-glob-to-any-file: "tests/**/*"

"type:docs":
  - head-branch: ["^docs/"]
  - changed-files:
      - any-glob-to-any-file: "docs/**/*"
      - any-glob-to-any-file: "**/*.md"

"type:refactor":
  - head-branch: ["^refactor/", "cleanup"]
  - changed-files:
      - any-glob-to-any-file: "src/**/*"

"type:chore":
  - head-branch: ["^chore/", "maintenance", "^ci/", "^pipeline/", "^workflow/"]
  - changed-files:
      - any-glob-to-any-file: "build.fsx"
      - any-glob-to-any-file: "paket.*"
      - any-glob-to-any-file: "dotnet-tools.json"
      - any-glob-to-any-file: "Directory.Build.props"
      - any-glob-to-any-file: ".github/scripts/*.fsx"
      - any-glob-to-any-file: ".github/config/labels.json"
      - any-glob-to-any-file: "package.json"

"type:test":
  - changed-files:
      - any-glob-to-any-file: "tests/**/*"
      - any-glob-to-any-file: "**/*Tests*.fs"

"type:ci":
  - head-branch: ["^ci/", "^pipeline/", "^workflow/"]
  - changed-files:
      - any-glob-to-any-file: ".github/workflows/**/*"
      - any-glob-to-any-file: ".github/scripts/*.fsx"

# 🔹 Приоритеты
"priority:critical":
  - head-branch: ["^urgent/", "critical", "P0"]

"priority:high":
  - head-branch: ["^important/", "high", "P1"]

# 🔹 Статус PR
"draft":
  - head-branch: ["^wip/", "^draft/", "in-progress"]

"ready-for-review":
  - head-branch: ["^pr/", "^review/", "rfc"]
