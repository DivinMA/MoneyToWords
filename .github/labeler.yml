# 🔹 Области кода
"area:core":
  - changed-files:
      - any-glob-to-any-file: "src/MoneyToWords/**/*"

"area:tests":
  - changed-files:
      - any-glob-to-any-file: "tests/**/*"

"area:examples":
  - changed-files:
      - any-glob-to-any-file: "examples/**/*"

"area:ci":
  - changed-files:
      - any-glob-to-any-file: ".github/workflows/**/*"
      - any-glob-to-any-file: ".github/scripts/*.fsx"
      - any-glob-to-any-file: "Directory.Build.props"
      - any-glob-to-any-file: "dotnet-tools.json"

"area:docs":
  - changed-files:
      - any-glob-to-any-file: "docs/**/*"
      - any-glob-to-any-file: "README.md"
      - any-glob-to-any-file: "CONTRIBUTING.md"

# 🔹 Типы задач — только одно!
"type:bug":
  - head-branch: ["^fix/", "^hotfix/"]
  - changed-files:
      - any-glob-to-any-file: "src/**/*"

"type:feature":
  - head-branch: ["^feat/", "^feature/"]
  - changed-files:
      - any-glob-to-any-file: "src/**/*"

"type:docs":
  - head-branch: ["^docs/"]
  - changed-files:
      - any-glob-to-any-file: "**/*.md"
      - any-glob-to-any-file: "docs/**/*"

"type:refactor":
  - head-branch: ["^refactor/"]
  - changed-files:
      - any-glob-to-any-file: "src/**/*"

"type:chore":
  - head-branch: ["^chore/"]
  - changed-files:
      - any-glob-to-any-file: "Directory.Build.props"
      - any-glob-to-any-file: ".github/scripts/*.fsx"
      - any-glob-to-any-file: "dotnet-tools.json"

"type:test":
  - changed-files:
      - any-glob-to-any-file: "tests/**/*"

"type:ci":
  - head-branch: ["^ci/"]
  - changed-files:
      - any-glob-to-any-file: ".github/workflows/**/*"

# 🔹 Приоритеты
"priority:critical":
  - head-branch: ["^urgent/", "critical", "P0"]

"priority:high":
  - head-branch: ["^important/", "high", "P1"]

# 🔹 Статус PR
"draft":
  - head-branch: ["^wip/", "^draft/", "in-progress"]

"ready-for-review":
  - head-branch: ["^pr/", "^review/", "rfc"]
