# .github/labeler.yml

"version:patch":
  - head-branch: ["^fix/", "^hotfix/"]
  - changed-files:
      - any-glob-to-any-file: "src/**/*.fs"

"version:minor":
  - head-branch: ["^feat/", "^feature/"]
  - changed-files:
      - any-glob-to-any-file: "src/**/*"

"version:major":
  - head-branch: ["^breaking/", "^remove/", "major"]
  - changed-files:
      - any-glob-to-any-file: "public-api.txt"

"area:core":
  - changed-files:
      - any-glob-to-any-file: "src/MoneyToWords/**/*"

"area:tests":
  - changed-files:
      - any-glob-to-any-file: "tests/**/*"

"area:examples":
  - changed-files:
      - any-glob-to-any-file: "examples/**/*"

"area:ci":
  - changed-files:
      - any-glob-to-any-file: ".github/workflows/**/*"
      - any-glob-to-any-file: ".github/scripts/*.fsx"
      - any-glob-to-any-file: "Directory.Build.props"
      - any-glob-to-any-file: "dotnet-tools.json"

"area:docs":
  - changed-files:
      - any-glob-to-any-file: "docs/**/*"
      - any-glob-to-any-file: "README.md"
      - any-glob-to-any-file: "CONTRIBUTING.md"

"type:bug":
  - head-branch: ["^fix/", "^hotfix/"]
  - changed-files:
      - any-glob-to-any-file: "src/**/*"

"type:feature":
  - head-branch: ["^feat/", "^feature/"]
  - changed-files:
      - any-glob-to-any-file: "src/**/*"

"type:docs":
  - head-branch: ["^docs/"]
  - changed-files:
      - any-glob-to-any-file: "**/*.md"
      - any-glob-to-any-file: "docs/**/*"

"type:refactor":
  - head-branch: ["^refactor/"]
  - changed-files:
      - any-glob-to-any-file: "src/**/*"

"type:chore":
  - head-branch: ["^chore/"]
  - changed-files:
      - any-glob-to-any-file: "Directory.Build.props"
      - any-glob-to-any-file: ".github/scripts/*.fsx"
      - any-glob-to-any-file: "dotnet-tools.json"

"type:test":
  - changed-files:
      - any-glob-to-any-file: "tests/**/*"

"type:ci":
  - head-branch: ["^ci/"]
  - changed-files:
      - any-glob-to-any-file: ".github/workflows/**/*"
