name-template: 'v$RESOLVED_VERSION'
tag-template: 'v$RESOLVED_VERSION'

categories:
  - title: '🚀 Features'
    labels: [feature, enhancement, feat, 'type:feature']
  - title: '🐛 Bug Fixes'
    labels: [fix, bug, 'type:fix']
  - title: '🔧 Improvements'
    labels: [improvement, optimize]
  - title: '🧹 Refactoring'
    labels: [refactor, 'code-quality']
  - title: '📚 Documentation'
    labels: [docs, documentation]
  - title: '⚙️ Maintenance'
    labels: [chore, ci, dependencies, 'dependency-update']
  - title: '💥 Breaking Changes'
    labels: [breaking, major, 'backwards-incompatible']

exclude-labels:
  - ignore-for-release
  - skip-changelog
  - draft

version-resolver:
  major: { labels: [major, breaking, 'backwards-incompatible'] }
  minor: { labels: [feature, enhancement, feat] }
  patch: { labels: [fix, bug, docs, chore, ci] }
  default: patch

change-template: '- $TITLE (#$NUMBER)'
template: |
  ## What's Changed

  $CHANGES

  ---
  ## How to Install
  ```bash
  dotnet add package MoneyToWordsFSharpLib --version $RESOLVED_VERSION
  ```

  Changelog
  Full changelog: [Compare $PREVIOUS_TAG...$NEXT_TAG](https://github.com/DivinMA/MoneyToWords/compare/$PREVIOUS_TAG...$NEXT_TAG)