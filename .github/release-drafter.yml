name-template: 'v$RESOLVED_VERSION'
tag-template: 'v$RESOLVED_VERSION'

categories:
  - title: '🚀 Features'
    labels:
      - 'feature'
      - 'enhancement'
  - title: '🐛 Bug Fixes'
    labels:
      - 'fix'
      - 'bugfix'
      - 'bug'
  - title: '🧹 Refactoring'
    labels:
      - 'refactor'
  - title: '📚 Documentation'
    labels:
      - 'docs'
  - title: '⚙️ Maintenance'
    labels:
      - 'chore'
      - 'ci'
      - 'dependencies'

version-resolver:
  major:
    labels:
      - 'major'
  minor:
    labels:
      - 'minor'
  patch:
    labels:
      - 'patch'
  default: patch

change-template: '- $TITLE (#$NUMBER)'
template: |
  ## What's Changed

  $CHANGES

  ---

  ## How to Install

  ```bash
  dotnet add package MoneyToWordsFSharpLib --version $RESOLVED_VERSION
  ```
  ---

  ## Changelog
  Full changelog: Compare $PREVIOUS_TAG...$TAG