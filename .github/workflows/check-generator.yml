name: Check Label Generator

on:
  push:
    branches: [main, staging]
    paths:
      - '.github/config/labels.json'
      - '.github/scripts/generate-contributing.fsx'
      - 'package.json'
  pull_request:
    paths:
      - '.github/config/labels.json'
      - '.github/scripts/generate-contributing.fsx'
      - 'package.json'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '>=24'
          cache: 'npm'
          # package-manager-cache: true  # По умолчанию true, можно не указывать

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Install Fantomas CLI tool
        run: dotnet tool install -g fantomas --version 8.0.0-alpha-002

      - name: Verify Fantomas installation
        run: fantomas --version

      - name: Install npm dependencies
        run: npm install

      - name: Run verification
        run: npm run ci-check
