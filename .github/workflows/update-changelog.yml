name: "Update CHANGELOG on release"

on:
  release:
    types: [published]

permissions:
  contents: write
  issues: write

jobs:
  update-changelog:
    runs-on: ubuntu-latest
    steps:
      - name: 🔁 Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: 🔍 Get release notes
        id: release
        run: |
          TAG=${{ github.event.release.tag_name }}
          echo "Release tag: $TAG"
          gh release view "$TAG" --json body --jq '.body' > release_body.txt
          RELEASE_BODY=$(cat release_body.txt)
          echo "release_body<<EOF" >> $GITHUB_OUTPUT
          echo "$RELEASE_BODY" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: ✍️ Create changelog update branch
        id: branch
        run: |
          VERSION=${{ github.event.release.tag_name }}
          BRANCH="changelog/${VERSION}"
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git checkout -b "$BRANCH"

          # Prepend release notes to CHANGELOG.md
          RELEASE_NOTES=$(cat release_body.txt)
          printf "## %s\n\n%s\n\n" "${VERSION}" "${RELEASE_NOTES}" > /tmp/entry.md
          cat CHANGELOG.md >> /tmp/entry.md
          mv /tmp/entry.md CHANGELOG.md

          git add CHANGELOG.md
          git commit -m "chore(changelog): update CHANGELOG for ${VERSION}"
          git push --set-upstream origin "$BRANCH"

          echo "branch=$BRANCH" >> $GITHUB_OUTPUT

      - name: 🔀 Open PR
        run: |
          gh pr create --title "chore: update CHANGELOG for ${{ github.event.release.tag_name }}" --body "This PR updates CHANGELOG.md with the release notes for ${{ github.event.release.tag_name }}" --base main --head ${{ steps.branch.outputs.branch }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
