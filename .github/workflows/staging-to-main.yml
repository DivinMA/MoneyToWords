name: 🔒 Enforce staging → main

on:
  pull_request:
    types: [opened, reopened, synchronize]
    branches: [main]

permissions:
  pull-requests: read
  checks: write

jobs:
  enforce-merge-flow:
    runs-on: ubuntu-latest
    name: Prevent direct merges to main

    steps:
      - name: 🚫 Block non-staging PRs to main
        run: |
          HEAD_REF="${{ github.event.pull_request.head.ref }}"

          if [[ "$HEAD_REF" == "staging" ]] || 
             [[ "$HEAD_REF" =~ ^release/ ]] || 
             [[ "$HEAD_REF" =~ ^hotfix/ ]]; then
            echo "✅ PR from '$HEAD_REF' to 'main' is allowed."
            exit 0
          else
            echo "::error::Direct PR to 'main' is forbidden. Merge via 'staging' first."
            echo "💡 Use: feature → staging → main"
            exit 1
          fi
