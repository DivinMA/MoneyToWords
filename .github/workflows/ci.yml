name: CI/CD

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  release:
    types: [ published ]

jobs:
  # ===================================================================
  # 1. СБОРКА (Build) — всегда
  # ===================================================================
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read

    strategy:
      matrix:
        dotnet-version: ['10.0.102']

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET with caching
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: ${{ matrix.dotnet-version }}
          cache: true

      - name: Restore dependencies (locked)
        run: dotnet restore --locked-mode

      - name: Build project
        run: |
          dotnet build src/MoneyToWords/MoneyToWords.fsproj \
            --configuration Release \
            --no-incremental \
            --no-restore

      - name: Upload Artifacts (for downstream jobs)
        uses: actions/upload-artifact@v4
        with:
          name: built-artifacts
          path: |
            src/MoneyToWords/bin/Release/
            src/MoneyToWords/obj/Release/
          retention-days: 5
          if-no-files-found: error


  # ===================================================================
  # 2. ТЕСТИРОВАНИЕ (Test) — после успешной сборки
  # ===================================================================
  test:
    needs: build
    runs-on: ubuntu-latest

    strategy:
      matrix:
        dotnet-version: ['10.0.102']

    steps:
      - name: Download built artifacts
        uses: actions/download-artifact@v4
        with:
          name: built-artifacts
          path: src/MoneyToWords/

      - name: Setup .NET
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: ${{ matrix.dotnet-version }}

      - name: Run tests
        run: |
          dotnet test src/MoneyToWords/MoneyToWords.fsproj \
            --configuration Release \
            --no-build \
            --verbosity normal \
            --logger trx

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            **/TestResults/*.trx
            !**/node_modules/**
          retention-days: 5


  # ===================================================================
  # 3. ПАКОВКА ДЛЯ ПРОВЕРКИ (Pack Validation) — только в PR
  # ===================================================================
  pack-validation:
    if: github.event_name == 'pull_request'
    needs: test
    runs-on: ubuntu-latest

    strategy:
      matrix:
        dotnet-version: ['10.0.102']

    steps:
      - name: Download built artifacts
        uses: actions/download-artifact@v4
        with:
          name: built-artifacts
          path: src/MoneyToWords/

      - name: Setup .NET
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: ${{ matrix.dotnet-version }}

      - name: Pack for validation
        run: |
          echo "📦 Validating package structure"
          dotnet pack src/MoneyToWords/MoneyToWords.fsproj \
            --configuration Release \
            --no-build \
            --output ./artifacts \
            /p:IncludeSymbols=true \
            /p:SymbolPackageFormat=snupkg \
            /p:ContinuousIntegrationBuild=true \
            /p:NoWarn=NU5128

      - name: List created packages
        run: |
          ls -la ./artifacts/

      - name: Upload NuPkg artifact
        uses: actions/upload-artifact@v4
        with:
          name: validated-package
          path: ./artifacts/*.nupkg
          if-no-files-found: warn


  # ===================================================================
  # 4. ПУБЛИКАЦИЯ (Publish) — только при публикации релиза
  # ===================================================================
  publish:
    if: github.event_name == 'release' && github.event.action == 'published'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write  # Для OIDC и безопасного доступа

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: '10.0.102'
          cache: true

      - name: Restore dependencies (locked)
        run: dotnet restore # --locked-mode --force-evaluate

      - name: Pack with MinVer (release version)
        id: pack
        run: |
          echo "🔖 Building release version: ${{ github.event.release.tag_name }}"
          dotnet pack src/MoneyToWords/MoneyToWords.fsproj \
            --configuration Release \
            --no-restore \
            --output ./artifacts \
            /p:IncludeSymbols=true \
            /p:SymbolPackageFormat=snupkg

          NUPKG_FILE=$(find ./artifacts -name "*.nupkg" -type f -print -quit)
          if [ -z "$NUPKG_FILE" ]; then
            echo "❌ No .nupkg file created"
            exit 1
          fi

          echo "PACKAGED_FILE=$NUPKG_FILE" >> $GITHUB_OUTPUT
          echo "PACKAGED_FILENAME=$(basename $NUPKG_FILE)" >> $GITHUB_OUTPUT

      - name: Publish to NuGet.org
        run: |
          dotnet nuget push "${{ steps.pack.outputs.PACKAGED_FILE }}" \
            --source https://api.nuget.org/v3/index.json \
            --api-key ${{ secrets.NUGET_API_KEY }} \
            --skip-duplicate

      - name: Attach package to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.pack.outputs.PACKAGED_FILE }}
          name: ${{ github.event.release.name }}
          body: ${{ github.event.release.body }}
          token: ${{ secrets.GITHUB_TOKEN }}