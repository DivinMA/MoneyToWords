name: CI

on:
  pull_request:
    branches: [main, staging]
  push:
    branches: [main, staging]

jobs:
  # ===================================================================
  # ЕДИНЫЙ JOB: Build + Test + Pack Validation
  # ===================================================================
  ci:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read

    strategy:
      matrix:
        dotnet-version: ['10.0.x']

    steps:
      - name: 🔁 Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0  # Критично для MinVer

      # DEBUG: Диагностика .git и тегов — можно удалить после настройки
      - name: "🧪 DEBUG: Check git and tags (safe to remove later)"
        run: |
          echo "🔍 Git directory:"
          ls -la .git || echo "❌ .git not found"
          
          echo "📡 Fetching all tags..."
          git fetch --prune --tags --verbose
          
          echo "📦 Available tags (latest 10):"
          git tag --list --sort=-version:refname | head -10
          
          if git tag --list | grep -q "^v1\.2\.0$"; then
            echo "✅ Tag v1.2.0 is present"
          else
            echo "❌ Tag v1.2.0 is MISSING — MinVer may fallback to 1.1.0"
          fi
        # DEBUG: Удалить после подтверждения стабильности

      - name: ⚙️ Setup .NET ${{ matrix.dotnet-version }}
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ matrix.dotnet-version }}
          cache: false

      - name: 💾 Cache NuGet packages
        uses: actions/cache@v5
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/packages.lock.json') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: 🧹 Remove packages.lock.json (workaround for preview SDK)
        run: |
          find . -name "packages.lock.json" -type f -delete || true

      - name: 🔧 Restore dependencies
        run: |
          echo "📦 Running dotnet restore"
          dotnet restore --force-evaluate

      - name: 🔨 Build library
        run: |
          echo "🔨 Building MoneyToWords..."
          dotnet build src/MoneyToWords/MoneyToWords.fsproj \
            --configuration Release \
            --no-incremental \
            --no-restore

      - name: 🎨 Check code format
        run: |
          echo "🔍 Verifying code formatting (dotnet format)"
          # Ensure dotnet-format is available
          if ! command -v dotnet-format >/dev/null 2>&1; then
            echo "⚠️ dotnet-format not found, attempting to install..."
            dotnet tool install --global dotnet-format || dotnet tool update --global dotnet-format
            export PATH="$HOME/.dotnet/tools:$PATH"
          fi
          dotnet format --verify-no-changes

      - name: 🔎 Check README install command
        run: |
          echo "🔍 Ensuring README contains correct install command"
          if ! grep -q "dotnet add package MoneyToWordsFSharpLib" README.md; then
            echo "❌ README.md must contain 'dotnet add package MoneyToWordsFSharpLib'"
            exit 1
          fi

      - name: 🔎 F# Lint (FSharpLint)
        run: |
          echo "🔍 Installing and running F# lint (dotnet-fsharplint)"
          dotnet tool install --global dotnet-fsharplint || dotnet tool update --global dotnet-fsharplint
          export PATH="$HOME/.dotnet/tools:$PATH"
          mkdir -p TestResults
          # Produce msbuild-style output and save as artifact
          dotnet-fsharplint lint --format msbuild --file-type project src/MoneyToWords/MoneyToWords.fsproj > TestResults/fsharplint.msbuild || true
          # Also run standard lint to fail on issues
          dotnet-fsharplint lint --file-type project src/MoneyToWords/MoneyToWords.fsproj

      - name: 📄 Upload fsharplint report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: fsharplint-report
          path: TestResults/fsharplint.msbuild

      - name: 🔄 Convert fsharplint report to SARIF and upload to Code Scanning
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "🔧 Attempting to convert fsharplint msbuild report to SARIF"
          export PATH="$HOME/.dotnet/tools:$PATH"
          # Install Sarif.Multitool if possible
          dotnet tool install --global Sarif.Multitool || dotnet tool update --global Sarif.Multitool || true
          export PATH="$HOME/.dotnet/tools:$PATH"
          SARIF_OUT=TestResults/fsharplint.sarif

          # Prefer 'convert' if available, otherwise try 'transform'; quiet errors to reduce log noise
          if sarif --help 2>/dev/null | grep -q "convert"; then
            sarif convert --input TestResults/fsharplint.msbuild --output $SARIF_OUT 2>/dev/null || sarif convert TestResults/fsharplint.msbuild $SARIF_OUT 2>/dev/null || true
          elif sarif --help 2>/dev/null | grep -q "transform"; then
            sarif transform TestResults/fsharplint.msbuild $SARIF_OUT 2>/dev/null || true
          else
            echo "⚠️ 'sarif' tool doesn't support convert/transform; skipping SARIF conversion"
          fi

          if [ -f "$SARIF_OUT" ]; then
            echo "✅ SARIF created: $SARIF_OUT"
            echo "📤 Uploading SARIF to GitHub Code Scanning API"
            # Prepare JSON payload with sarif content
            SARIF_CONTENT=$(python -c "import json,sys; print(json.dumps(open('"$SARIF_OUT"','r').read()))")
            DATA=$(printf '{"commit_sha":"%s","ref":"%s","sarif": %s}' "${{ github.sha }}" "${{ github.ref }}" "$SARIF_CONTENT")
            curl -s -S -H "Authorization: token $GITHUB_TOKEN" -H "Content-Type: application/json" -d "$DATA" "https://api.github.com/repos/${{ github.repository }}/code-scanning/sarifs" || true
          else
            echo "⚠️ SARIF file not generated; skipping upload"
          fi

      - name: 🔐 Check for vulnerable packages
        run: |
          echo "🔍 Checking for vulnerable packages"
          dotnet list package --vulnerable > vulnerabilities.txt || true
          if grep -q "No vulnerable packages were found" vulnerabilities.txt; then
            echo "✅ No vulnerable packages found"
          elif [ -s vulnerabilities.txt ]; then
            echo "❌ Vulnerable packages found:" && cat vulnerabilities.txt && exit 1
          else
            echo "⚠️ Couldn\'t determine vulnerable packages; skipping check"
          fi

      # Уверенность, что MinVer сработал — по выводу из сборки
      - name: 🏷️ Log resolved version (MinVer)
        run: |
          echo "🔍 Resolving version via MinVer..."
          VERSION=$(dotnet msbuild -nologo -getProperty:PackageVersion /p:DesignTimeBuild=true src/MoneyToWords/MoneyToWords.fsproj)
          echo "📦 Final PackageVersion: $VERSION"
          if [ -z "$VERSION" ]; then
            echo "::error::Failed to resolve version via MinVer"
            exit 1
          fi

      - name: 🧪 Run TextOutput tests (isolated)
        run: |
          echo "🧪 Running TextOutput unit tests (isolated)"
          mkdir -p TestResults
          dotnet test tests/MoneyToWords.Tests/MoneyToWords.Tests.fsproj --configuration Release --filter "FullyQualifiedName~TextOutput" --logger "trx;LogFileName=${{ github.workspace }}/TestResults/textoutput.trx"

      - name: 🧪 Run tests & collect coverage
        run: |
          echo "🧪 Running tests..."
          mkdir -p TestResults
          dotnet test tests/MoneyToWords.Tests/MoneyToWords.Tests.fsproj --configuration Release --verbosity normal --logger "trx;LogFileName=${{ github.workspace }}/TestResults/results.trx" /p:CollectCoverage=true /p:CoverletOutputFormat=cobertura /p:CoverletOutput=${{ github.workspace }}/TestResults/coverage.cobertura.xml /p:Threshold=85 /p:ThresholdType=line /p:ThresholdStat=total

      - name: 📤 Upload test results (if failed)
        if: always() && github.event_name == 'pull_request'
        uses: actions/upload-artifact@v6
        with:
          name: test-results
          path: TestResults/results.trx
          retention-days: 5

      - name: 📊 Upload coverage to Codecov (optional)
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
        if: github.event_name == 'pull_request' && env.CODECOV_TOKEN != ''
        uses: codecov/codecov-action@v4
        with:
          token: ${{ env.CODECOV_TOKEN }}
          files: TestResults/coverage.cobertura.xml
          flags: unittests
          fail_ci_if_error: true
          verbose: true

      - name: 📦 Validate package (PR only)
        if: github.event_name == 'pull_request'
        run: |
          echo "📦 Validating package structure"
          dotnet pack src/MoneyToWords/MoneyToWords.fsproj \
            --configuration Release \
            --no-build \
            --output ./artifacts \
            /p:IncludeSymbols=true \
            /p:SymbolPackageFormat=snupkg \
            /p:ContinuousIntegrationBuild=true \
            /p:NoWarn=NU5128

          echo "🔖 Final PackageVersion:"
          dotnet msbuild -nologo -getProperty:PackageVersion /p:DesignTimeBuild=true src/MoneyToWords/MoneyToWords.fsproj

          ls -la ./artifacts/

      - name: 📤 Upload validated package
        if: github.event_name == 'pull_request' && success()
        uses: actions/upload-artifact@v6
        with:
          name: validated-package
          path: ./artifacts/*.nupkg
          retention-days: 5

  # ===================================================================
  # Проверка лейблов
  # ===================================================================
  validate-pr:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    needs: ci
    permissions:
      contents: read
      pull-requests: read
      issues: write

    steps:
      - name: 🔁 Checkout code
        uses: actions/checkout@v6

      - name: 🔄 Ensure labels exist (sync-labels)
        run: |
          echo "🔐 Authenticating gh CLI..."
          echo "${{ secrets.GITHUB_TOKEN }}" | gh auth login --with-token
          echo "🔁 Running sync-labels to ensure labels are present..."
          export PR_NUMBER=${{ github.event.number }}
          dotnet fsi .github/scripts/sync-labels.fsx --apply
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 🏷️ Apply automatic labels (labeler)
        uses: actions/labeler@v6
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: 🏷️ Validate required labels and compliance
        run: |
          echo "🔍 Получаем лейблы PR #${{ github.event.number }}"
          labels_json=$(gh pr view ${{ github.event.number }} --json labels --jq '.labels[].name')
          mapfile -t labels <<< "$labels_json"

          if [ ${#labels[@]} -eq 0 ]; then
            echo "❌ PR без лейблов — просьба добавить метки (type:, area:, priority: и пр.)"
            exit 1
          fi

          echo "🔎 Проверяем наличие основных категорий меток (type:, area:, priority:, patch/minor/major, draft/ready-for-review)"
          found=false
          for l in "${labels[@]}"; do
            if echo "$l" | grep -Eq "^(type:|area:|priority:|effort:|patch|minor|major|draft|ready-for-review)"; then
              found=true
              break
            fi
          done

          if [ "$found" = false ]; then
            echo "❌ PR не содержит меток из основных категорий (type:, area:, priority:, effort:, patch/minor/major, draft/ready-for-review)."
            exit 1
          fi

          echo "✅ Метыки PR соответствуют правилам"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ===================================================================
  # Публикация
  # ===================================================================
  publish:
    if: github.event_name == 'release' && github.event.action == 'published'
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write

    steps:
      - name: 🔁 Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: ⚙️ Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: 💾 Cache NuGet packages
        uses: actions/cache@v5
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/packages.lock.json') }}

      - name: 🧹 Remove packages.lock.json
        run: |
          find . -name "packages.lock.json" -type f -delete || true

      - name: 🛰️ Fetch all tags
        run: |
          git fetch --prune --tags
          echo "📦 Tags available:"
          git tag --list --sort=-version:refname | head -10

      - name: 🔧 Restore and Build
        run: |
          dotnet restore --force-evaluate
          dotnet build src/MoneyToWords/MoneyToWords.fsproj \
            --configuration Release \
            /p:RepositoryUrl=https://github.com/DivinMA/MoneyToWords \
            /bl:build.binlog

      - name: 📦 Pack with MinVer
        id: pack
        run: |
          dotnet pack src/MoneyToWords/MoneyToWords.fsproj \
            --configuration Release \
            --output ./artifacts \
            /p:IncludeSymbols=true \
            /p:SymbolPackageFormat=snupkg \
            /p:ContinuousIntegrationBuild=true

      - name: ✅ Verify package version and contents
        run: |
          echo "📦 Final version:"
          dotnet msbuild -nologo -getProperty:PackageVersion
          ls -la ./artifacts/
          find ./artifacts -name "*.nupkg" -exec echo "✅ Created package:" {} \;

      - name: Publish to NuGet.org
        run: |
          dotnet nuget push "./artifacts/*.nupkg" \
            --source https://api.nuget.org/v3/index.json \
            --api-key ${{ secrets.NUGET_API_KEY }} \
            --skip-duplicate

      - name: Attach package to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: ./artifacts/*.nupkg
          token: ${{ secrets.GITHUB_TOKEN }}
