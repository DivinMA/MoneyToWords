name: CI

on:
  pull_request:
    branches: [ main, staging ]
  push:
    branches: [ main, staging ]

jobs:
  # ===================================================================
  # ЕДИНЫЙ JOB: Build + Test + Pack Validation
  # ===================================================================
  ci:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read

    strategy:
      matrix:
        dotnet-version: ['10.0.x']

    steps:
      - name: 🔁 Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0  # Критично для MinVer

      # DEBUG: Диагностика .git и тегов — можно удалить после настройки
      - name: "🧪 DEBUG: Check git and tags (safe to remove later)"
        run: |
          echo "🔍 Git directory:"
          ls -la .git || echo "❌ .git not found"
          
          echo "📡 Fetching all tags..."
          git fetch --prune --tags --verbose
          
          echo "📦 Available tags (latest 10):"
          git tag --list --sort=-version:refname | head -10
          
          if git tag --list | grep -q "^v1\.2\.0$"; then
            echo "✅ Tag v1.2.0 is present"
          else
            echo "❌ Tag v1.2.0 is MISSING — MinVer may fallback to 1.1.0"
          fi
        # DEBUG: Удалить после подтверждения стабильности

      - name: ⚙️ Setup .NET ${{ matrix.dotnet-version }}
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ matrix.dotnet-version }}
          cache: false

      - name: 💾 Cache NuGet packages
        uses: actions/cache@v5
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/packages.lock.json') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: 🧹 Remove packages.lock.json (workaround for preview SDK)
        run: |
          find . -name "packages.lock.json" -type f -delete || true

      - name: 🔧 Restore dependencies
        run: |
          echo "📦 Running dotnet restore"
          dotnet restore --force-evaluate

      - name: 🔨 Build library
        run: |
          echo "🔨 Building MoneyToWords..."
          dotnet build src/MoneyToWords/MoneyToWords.fsproj \
            --configuration Release \
            --no-incremental \
            --no-restore

      - name: 🎨 Check code format
        run: |
          echo "🔍 Verifying code formatting (dotnet format)"
          dotnet tool restore || true
          dotnet format --verify-no-changes

      # Уверенность, что MinVer сработал — по выводу из сборки
      - name: ✅ Confirm MinVer output from build
        run: |
          echo "✅ MinVer should have printed version during build:"
          echo "    Example: 🔖 Version: 1.2.1-alpha.4"
          echo "💡 If you see it above — MinVer is working."
          echo "❗ If not — check Directory.Build.props and git tags."

      - name: 🧪 Run tests & collect coverage
        run: |
          echo "🧪 Running tests..."
          mkdir -p TestResults
          dotnet test tests/MoneyToWords.Tests/MoneyToWords.Tests.fsproj --configuration Release --verbosity normal --logger "trx;LogFileName=${{ github.workspace }}/TestResults/results.trx" /p:CollectCoverage=true /p:CoverletOutputFormat=cobertura /p:CoverletOutput=${{ github.workspace }}/TestResults/coverage.cobertura.xml /p:Threshold=80 /p:ThresholdType=line /p:ThresholdStat=total

      - name: 📤 Upload test results (if failed)
        if: always() && github.event_name == 'pull_request'
        uses: actions/upload-artifact@v6
        with:
          name: test-results
          path: TestResults/results.trx
          retention-days: 5

      - name: 📊 Upload coverage to Codecov (optional)
        if: always() && github.event_name == 'pull_request'
        uses: codecov/codecov-action@v4
        with:
          files: TestResults/coverage.cobertura.xml
          flags: unittests
          fail_ci_if_error: false
          verbose: true

      - name: 📦 Validate package (PR only)
        if: github.event_name == 'pull_request'
        run: |
          echo "📦 Validating package structure"
          dotnet pack src/MoneyToWords/MoneyToWords.fsproj \
            --configuration Release \
            --no-build \
            --output ./artifacts \
            /p:IncludeSymbols=true \
            /p:SymbolPackageFormat=snupkg \
            /p:ContinuousIntegrationBuild=true \
            /p:NoWarn=NU5128

          echo "🔖 Final PackageVersion:"
          dotnet msbuild -nologo -getProperty:PackageVersion /p:DesignTimeBuild=true src/MoneyToWords/MoneyToWords.fsproj

          ls -la ./artifacts/

      - name: 📤 Upload validated package
        if: github.event_name == 'pull_request' && success()
        uses: actions/upload-artifact@v6
        with:
          name: validated-package
          path: ./artifacts/*.nupkg
          retention-days: 5

  # ===================================================================
  # Проверка лейблов
  # ===================================================================
  validate-pr:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    needs: ci
    permissions:
      contents: read
      pull-requests: read

    steps:
      - name: 🔁 Checkout code
        uses: actions/checkout@v6

      - name: 🏷️ Validate required labels
        run: |
          echo "🔍 Получаем лейблы PR #${{ github.event.number }}"
          labels_json=$(gh pr view ${{ github.event.number }} --json labels --jq '.labels[].name')
          mapfile -t labels <<< "$labels_json"

          if [ ${#labels[@]} -eq 0 ]; then
            echo "❌ PR без лейблов"
            exit 1
          fi

          # Твой существующий скрипт проверки лейблов
          # (оставь как есть — он работает)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ===================================================================
  # Публикация
  # ===================================================================
  publish:
    if: github.event_name == 'release' && github.event.action == 'published'
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write

    steps:
      - name: 🔁 Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: ⚙️ Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: 💾 Cache NuGet packages
        uses: actions/cache@v5
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/packages.lock.json') }}

      - name: 🧹 Remove packages.lock.json
        run: |
          find . -name "packages.lock.json" -type f -delete || true

      - name: 🛰️ Fetch all tags
        run: |
          git fetch --prune --tags
          echo "📦 Tags available:"
          git tag --list --sort=-version:refname | head -10

      - name: 🔧 Restore and Build
        run: |
          dotnet restore --force-evaluate
          dotnet build src/MoneyToWords/MoneyToWords.fsproj \
            --configuration Release \
            /p:RepositoryUrl=https://github.com/DivinMA/MoneyToWords \
            /bl:build.binlog

      - name: 📦 Pack with MinVer
        id: pack
        run: |
          dotnet pack src/MoneyToWords/MoneyToWords.fsproj \
            --configuration Release \
            --output ./artifacts \
            /p:IncludeSymbols=true \
            /p:SymbolPackageFormat=snupkg \
            /p:ContinuousIntegrationBuild=true

      - name: ✅ Verify package version and contents
        run: |
          echo "📦 Final version:"
          dotnet msbuild -nologo -getProperty:PackageVersion
          ls -la ./artifacts/
          find ./artifacts -name "*.nupkg" -exec echo "✅ Created package:" {} \;

      - name: Publish to NuGet.org
        run: |
          dotnet nuget push "./artifacts/*.nupkg" \
            --source https://api.nuget.org/v3/index.json \
            --api-key ${{ secrets.NUGET_API_KEY }} \
            --skip-duplicate

      - name: Attach package to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: ./artifacts/*.nupkg
          token: ${{ secrets.GITHUB_TOKEN }}
