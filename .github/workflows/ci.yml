# .github/workflows/ci.yml
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, staging]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 🔁 Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: ⚙️ Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: 🔚 Shutdown build server
        run: dotnet build-server shutdown || true

      # ❌ Отключаю кэширование NuGet из-за проблем с FSharp.Core
      # Причина: кэширование вызывает конфликты хешей с FSharp.Core
      # Решение: отключить кэш и выполнять полную очистку перед restore
      # Это менее эффективно, но надежно решает проблему NU1403
      # - name: 💾 Cache NuGet packages
      #   uses: actions/cache@v5
      #   with:
      #     path: |
      #       ~/.nuget/packages
      #       ~/.nuget/packages/.tools
      #     key: ${{ runner.os }}-nuget-${{ hashFiles('**/packages.lock.json') }}-${{ hashFiles('**/*.props') }}
      #     restore-keys: |
      #       ${{ runner.os }}-nuget-

      - name: 🧹 Pre-clean FSharp.Core
        run: |
          echo "🧹 Cleaning FSharp.Core to avoid NU1403"
          # Remove all FSharp.Core instances from nuget packages
          rm -rf ~/.nuget/packages/fsharp.core
          rm -rf ~/.nuget/packages/.tools/fsharp.core

          # Remove from .NET SDK fallback folder
          echo "🧹 Also cleaning from /usr/share/dotnet/sdk/NuGetFallbackFolder/fsharp.core"
          rm -rf /usr/share/dotnet/sdk/NuGetFallbackFolder/fsharp.core || true

          # Remove from global tools
          echo "🧹 Also cleaning global tools"
          rm -rf ~/.dotnet/tools/fsharp.core || true

          # Remove from temp directories
          echo "🧹 Cleaning temp directories"
          find /tmp -name "*fsharp*" -exec rm -rf {} + || true
          find $HOME/tmp -name "*fsharp*" -exec rm -rf {} + || true

          # Ensure NuGetFallbackFolder is not used
          echo "🧹 Ensuring NuGetFallbackFolder is not used"
          echo "DOTNET_ROLL_FORWARD=LatestPatch" >> $GITHUB_ENV
          echo "NUGET_PACKAGES=$HOME/.nuget/packages" >> $GITHUB_ENV

          # Disable locked mode in CI
          echo "🧹 Disabling locked mode and cache"
          echo "RESTORE_LOCKED_MODE=false" >> $GITHUB_ENV

          # List remaining fsharp files for debugging
          echo "🔍 Checking for remaining FSharp files..."
          find ~/.nuget -name "*fsharp*" -type d || true
          find /usr/share/dotnet -name "*fsharp*" -type d || true

          # Clear dotnet temp folders
          echo "🧹 Clearing dotnet temp folders"
          dotnet nuget locals all --clear || true
        env:
          DOTNET_ROLL_FORWARD: LatestPatch
          NUGET_PACKAGES: /home/runner/.nuget/packages
          RESTORE_LOCKED_MODE: false
          MSBUILDDEBUGCONSOLE: 1
          NUGET_ENABLE_EXPERIMENTAL_HTTP_CLIENT: true

      - name: 🔧 Restore with lock file
        run: |
          dotnet restore --use-lock-file --disable-parallel --force --ignore-failed-sources --no-cache --packages /home/runner/.nuget/packages

      - name: 🔨 Build
        run: |
          dotnet build src/MoneyToWords/MoneyToWords.fsproj \
            --configuration Release \
            --no-incremental \
            --no-restore

      - name: 🎨 Check format
        run: |
          dotnet tool install --global dotnet-format || dotnet tool update --global dotnet-format
          export PATH="$HOME/.dotnet/tools:$PATH"
          dotnet format --verify-no-changes
          exit 0
        continue-on-error: true

      - name: 🔎 F# Lint
        run: |
          dotnet tool install --global dotnet-fsharplint || dotnet tool update --global dotnet-fsharplint
          export PATH="$HOME/.dotnet/tools:$PATH"
          dotnet fsharplint lint src/MoneyToWords/MoneyToWords.fsproj
          exit 0
        continue-on-error: true

      - name: 🧪 Test
        run: |
          dotnet test tests/MoneyToWords.Tests/MoneyToWords.Tests.fsproj \
            --configuration Release \
            --no-restore \
            --no-build
            --collect:"XPlat Code Coverage" \
            --settings coverlet.runsettings

      - name: 📊 Upload coverage
        if: github.ref == 'refs/heads/main' && success()
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          file: ./TestResults/coverage.cobertura.xml
