# .github/workflows/ci.yml
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, staging]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 🔁 Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: ⚙️ Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: 🔚 Shutdown build server
        run: dotnet build-server shutdown || true

      - name: 💾 Cache NuGet packages
        uses: actions/cache@v5
        with:
          path: |
            ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/packages.lock.json') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: 🧹 Pre-clean FSharp.Core
        run: |
          echo "🧹 Cleaning FSharp.Core to avoid NU1403"
          rm -rf ~/.nuget/packages/fsharp.core
          echo "🧹 Ensuring NuGetFallbackFolder is not used"
          export DOTNET_ROLL_FORWARD=LatestPatch
          export NUGET_PACKAGES=~/.nuget/packages

      - name: 🔧 Restore with lock file
        run: |
          dotnet restore --use-lock-file

      - name: 🔨 Build
        run: |
          dotnet build src/MoneyToWords/MoneyToWords.fsproj \
            --configuration Release \
            --no-incremental \

      - name: 🎨 Check format
        run: |
          dotnet tool install --global dotnet-format || dotnet tool update --global dotnet-format
          export PATH="$HOME/.dotnet/tools:$PATH"
          dotnet format --verify-no-changes

      - name: 🔎 F# Lint
        run: |
          dotnet tool install --global dotnet-fsharplint || dotnet tool update --global dotnet-fsharplint
          export PATH="$HOME/.dotnet/tools:$PATH"
          dotnet fsharplint lint src/MoneyToWords/MoneyToWords.fsproj

      - name: 🧪 Test
        run: |
          dotnet test tests/MoneyToWords.Tests/MoneyToWords.Tests.fsproj \
            --configuration Release \
            --no-restore \
            --collect:"XPlat Code Coverage" \
            --settings coverlet.runsettings

      - name: 📊 Upload coverage
        if: github.ref == 'refs/heads/main'
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          file: ./TestResults/coverage.cobertura.xml
