name: CI

on:
  pull_request:
    branches: [ main, staging ]
  push:
    branches: [ main, staging ]

jobs:
  # ===================================================================
  # ЕДИНЫЙ JOB: Build + Test + Pack Validation (с отладкой)
  # ===================================================================
  ci:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read

    strategy:
      matrix:
        dotnet-version: ['10.0.x']

    steps:
      - name: 🔁 Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # DEBUG: Начало диагностики MinVer и состояния репозитория
      - name: "🧪 DEBUG: Check .git directory"
        run: |
          echo "🔍 Checking .git directory..."
          ls -la .git || echo "❌ .git not found"
          git status --porcelain || echo "Git status unavailable"
        # DEBUG: Убедиться, что репозиторий склонирован с историей

      - name: "🛰️ DEBUG: Fetch all tags (ensure MinVer sees them)"
        run: |
          echo "📡 Fetching all tags for MinVer..."
          git fetch --prune --tags --verbose
          echo "📦 Available tags (latest 10):"
          git tag --list --sort=-version:refname | head -10
          if git tag --list | grep -q "v1.2.0"; then
            echo "✅ Tag v1.2.0 is present"
          else
            echo "❌ Tag v1.2.0 is MISSING!"
          fi
        # DEBUG: Критично для MinVer — должен видеть v1.2.0

      - name: ⚙️ Setup .NET ${{ matrix.dotnet-version }}
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ matrix.dotnet-version }}
          cache: false

      - name: 💾 Cache NuGet packages
        uses: actions/cache@v5
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/packages.lock.json') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: 🧹 Remove packages.lock.json (workaround for preview SDK)
        run: |
          find . -name "packages.lock.json" -type f -delete || true

      - name: 🔧 Restore dependencies
        run: |
          echo "📦 Running dotnet restore"
          dotnet restore --force-evaluate

      - name: 🔨 Build library
        run: |
          echo "🔨 Building MoneyToWords..."
          dotnet build src/MoneyToWords/MoneyToWords.fsproj \
            --configuration Release \
            --no-incremental \
            --no-restore

      - name: "📊 DEBUG: Force MinVer via build and read version"
        run: |
          echo "🔧 Building project to trigger MinVer..."
          dotnet build src/MoneyToWords/MoneyToWords.fsproj \
            --configuration Release \
            --no-incremental \
            --no-restore \
            /p:ContinuousIntegrationBuild=true \
            /bl:build-minver-debug.binlog

          echo "🔍 Reading version after build..."
          MINVER=$(dotnet msbuild -nologo -getProperty:MinVerVersion)
          PKGVER=$(dotnet msbuild -nologo -getProperty:PackageVersion)
          VERSION=$(dotnet msbuild -nologo -getProperty:Version)

          echo "🔖 MinVerVersion: $MINVER"
          echo "📦 PackageVersion: $PKGVER"
          echo "🔖 Version: $VERSION"

          if [ -z "$MINVER" ] || [ "$MINVER" = "1.0.0" ]; then
            echo "❌ MinVer failed to detect correct version"
            exit 1
          fi


      # DEBUG: Проверка версии после сборки
      - name: "📊 DEBUG: Show MinVer-determined version"
        run: |
          echo "🔍 Reading version properties..."
          MINVER=$(dotnet msbuild -nologo -getProperty:MinVerVersion /p:DesignTimeBuild=true)
          PKGVER=$(dotnet msbuild -nologo -getProperty:PackageVersion /p:DesignTimeBuild=true)
          VERSION=$(dotnet msbuild -nologo -getProperty:Version /p:DesignTimeBuild=true)

          echo "🔖 MinVerVersion: $MINVER"
          echo "📦 PackageVersion: $PKGVER"
          echo "🔖 Version: $VERSION"

          if [ -z "$MINVER" ] || [ "$MINVER" = "1.0.0" ]; then
            echo "❌ MinVer failed to detect correct version"
            exit 1
          fi
        # DEBUG: Проверка, что MinVer работает

      - name: 🧪 Run tests
        run: |
          echo "🧪 Running tests..."
          mkdir -p TestResults
          dotnet test tests/MoneyToWords.Tests/MoneyToWords.Tests.fsproj --configuration Release --verbosity normal --logger "trx;LogFileName=${{ github.workspace }}/TestResults/results.trx"
        # FIXED: Одна строка без \ → избегаем shell parse error

      - name: 📤 Upload test results (if failed)
        if: always() && github.event_name == 'pull_request'
        uses: actions/upload-artifact@v6
        with:
          name: test-results
          path: TestResults/results.trx
          retention-days: 5

      - name: 📦 Validate package (PR only)
        if: github.event_name == 'pull_request'
        run: |
          echo "📦 Validating package structure"
          dotnet pack src/MoneyToWords/MoneyToWords.fsproj \
            --configuration Release \
            --no-build \
            --output ./artifacts \
            /p:IncludeSymbols=true \
            /p:SymbolPackageFormat=snupkg \
            /p:ContinuousIntegrationBuild=true \
            /p:NoWarn=NU5128

          echo "🔖 Final PackageVersion:"
          dotnet msbuild -nologo -getProperty:PackageVersion /p:DesignTimeBuild=true

          ls -la ./artifacts/

      - name: 📤 Upload validated package
        if: github.event_name == 'pull_request' && success()
        uses: actions/upload-artifact@v6
        with:
          name: validated-package
          path: ./artifacts/*.nupkg
          retention-days: 5

  # ===================================================================
  # Проверка лейблов (остаётся отдельно)
  # ===================================================================
  validate-pr:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    needs: ci
    permissions:
      contents: read
      pull-requests: read

    steps:
      - name: 🔁 Checkout code
        uses: actions/checkout@v6

      - name: 🏷️ Validate required labels
        run: |
          echo "🔍 Получаем лейблы PR #${{ github.event.number }}"
          labels_json=$(gh pr view ${{ github.event.number }} --json labels --jq '.labels[].name')
          mapfile -t labels <<< "$labels_json"

          if [ ${#labels[@]} -eq 0 ]; then
            echo "❌ PR без лейблов"
            exit 1
          fi

          # (вставь сюда свой существующий скрипт проверки)
          # или оставь как есть — он уже работает
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ===================================================================
  # Публикация (с расширенной отладкой)
  # ===================================================================
  publish:
    if: github.event_name == 'release' && github.event.action == 'published'
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write

    steps:
      - name: 🔁 Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # DEBUG: Диагностика перед публикацией
      - name: "🧪 DEBUG: Git environmentv"
        run: |
          echo "🔍 Branch: $GITHUB_REF_NAME"
          echo "📦 Event: $GITHUB_EVENT_NAME"
          echo "🔖 Action: $GITHUB_EVENT_ACTION"
          echo "🧩 Workspace: $GITHUB_WORKSPACE"
          [ -d ".git" ] && echo "✅ .git exists" || echo "❌ .git missing"

      - name: "🛰️ DEBUG: Fetch all tags"
        run: |
          git fetch --prune --tags
          echo "📦 Tags available:"
          git tag --list --sort=-version:refname | head -10

      - name: ⚙️ Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: 💾 Cache NuGet packages
        uses: actions/cache@v5
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/packages.lock.json') }}

      - name: 🧹 Remove packages.lock.json
        run: |
          find . -name "packages.lock.json" -type f -delete || true

      - name: "📊 DEBUG: Show MinVer version before build"
        run: |
          MINVER=$(dotnet msbuild -nologo -getProperty:MinVerVersion /p:DesignTimeBuild=true)
          echo "🔖 MinVerVersion: $MINVER"
          [ -z "$MINVER" ] && exit 1

      - name: 🔧 Restore and Build
        run: |
          dotnet restore --force-evaluate
          dotnet build src/MoneyToWords/MoneyToWords.fsproj \
            --configuration Release \
            /p:RepositoryUrl=https://github.com/DivinMA/MoneyToWords \
            /bl:build.binlog

      - name: 📦 Pack with MinVer
        id: pack
        run: |
          dotnet pack src/MoneyToWords/MoneyToWords.fsproj \
            --configuration Release \
            --output ./artifacts \
            /p:IncludeSymbols=true \
            /p:SymbolPackageFormat=snupkg \
            /p:ContinuousIntegrationBuild=true

      - name: ✅ Verify package version and contents
        run: |
          echo "📦 Final version:"
          dotnet msbuild -nologo -getProperty:PackageVersion /p:DesignTimeBuild=true
          ls -la ./artifacts/
          find ./artifacts -name "*.nupkg" -exec echo "📦 Found package:" {} \;

      - name: Publish to NuGet.org
        run: |
          dotnet nuget push "./artifacts/*.nupkg" \
            --source https://api.nuget.org/v3/index.json \
            --api-key ${{ secrets.NUGET_API_KEY }} \
            --skip-duplicate

      - name: Attach package to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: ./artifacts/*.nupkg
          token: ${{ secrets.GITHUB_TOKEN }}
