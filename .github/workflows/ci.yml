name: CI/CD

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  release:
    types: [ published ]

jobs:
  # ===================================================================
  # 1. СБОРКА И ТЕСТИРОВАНИЕ НА НЕСКОЛЬКИХ ВЕРСИЯХ .NET
  # ===================================================================
  build_and_test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read

    strategy:
      matrix:
        dotnet-version: ['8.0.417', '9.0.309', '10.0.102']
        include:
          - dotnet-version: '8.0.417'
            is-preview: false
            target-framework: 'net8.0'
          - dotnet-version: '9.0.309'
            is-preview: false
            target-framework: 'net9.0'
          - dotnet-version: '10.0.102'
            is-preview: true
            target-framework: 'net10.0'

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET ${{ matrix.dotnet-version }}
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: ${{ matrix.dotnet-version }}
          cache: false

      - name: Cache NuGet packages per SDK version
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ matrix.dotnet-version }}-${{ hashFiles('**/*.fsproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-${{ matrix.dotnet-version }}-
            ${{ runner.os }}-nuget-

      # Удаляем lock-файл ТОЛЬКО в preview-версиях
      - name: Remove packages.lock.json (preview workaround)
        if: matrix.is-preview == true
        run: |
          find . -name "packages.lock.json" -type f -delete || echo "No lock files found"

      - name: Restore dependencies
        run: |
          echo "📦 Running dotnet restore --force-evaluate"
          dotnet restore --force-evaluate

      - name: Build project
        run: |
          dotnet build src/MoneyToWords/MoneyToWords.fsproj \
            --configuration Release \
            --no-incremental \
            --no-restore

      - name: Run tests
        run: |
          mkdir -p TestResults
          dotnet test src/MoneyToWords/MoneyToWords.fsproj \
            --configuration Release \
            --no-build \
            --verbosity normal \
            --logger "trx;LogFileName=$(pwd)/TestResults/results.${{ matrix.dotnet-version }}.trx"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.dotnet-version }}
          path: TestResults/
          retention-days: 5


  # ===================================================================
  # 2. ПАКОВКА ДЛЯ ПРОВЕРКИ (Pack Validation) — только в PR
  # ===================================================================
  pack-validation:
    if: github.event_name == 'pull_request'
    needs: build_and_test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        dotnet-version: ['10.0.102']  # Только одна версия для паковки

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET ${{ matrix.dotnet-version }}
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: ${{ matrix.dotnet-version }}
          cache: false

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ matrix.dotnet-version }}-${{ hashFiles('**/*.fsproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-${{ matrix.dotnet-version }}-
            ${{ runner.os }}-nuget-

      - name: Remove packages.lock.json (preview)
        run: |
          find . -name "packages.lock.json" -type f -delete || echo "No lock files found"

      - name: Restore dependencies
        run: dotnet restore --force-evaluate

      - name: Pack for validation
        run: |
          dotnet pack src/MoneyToWords/MoneyToWords.fsproj \
            --configuration Release \
            --no-restore \
            --output ./artifacts \
            /p:IncludeSymbols=true \
            /p:SymbolPackageFormat=snupkg \
            /p:ContinuousIntegrationBuild=true \
            /p:NoWarn=NU5128

      - name: List created packages
        run: ls -la ./artifacts/

      - name: Upload NuPkg artifact
        uses: actions/upload-artifact@v4
        with:
          name: validated-package
          path: ./artifacts/*.nupkg
          if-no-files-found: warn


  # ===================================================================
  # 3. ПУБЛИКАЦИЯ (Publish) — только при релизе, ОДИН раз
  # ===================================================================
  publish:
    if: github.event_name == 'release' && github.event.action == 'published'
    needs: build_and_test
    runs-on: ubuntu-latest
    # Без matrix — только один запуск

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET (latest for publishing)
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: '10.0.102'
          cache: false

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-10.0.102-${{ hashFiles('**/*.fsproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-10.0.102-
            ${{ runner.os }}-nuget-

      - name: Remove packages.lock.json (preview)
        run: |
          find . -name "packages.lock.json" -type f -delete || echo "No lock files found"

      - name: Restore dependencies
        run: dotnet restore --force-evaluate

      - name: Pack with MinVer
        id: pack
        run: |
          dotnet pack src/MoneyToWords/MoneyToWords.fsproj \
            --configuration Release \
            --no-restore \
            --output ./artifacts \
            /p:IncludeSymbols=true \
            /p:SymbolPackageFormat=snupkg

          NUPKG_FILE=$(find ./artifacts -name "*.nupkg" -type f -print -quit)
          echo "PACKAGED_FILE=$NUPKG_FILE" >> $GITHUB_OUTPUT
          echo "PACKAGED_FILENAME=$(basename $NUPKG_FILE)" >> $GITHUB_OUTPUT

      - name: Publish to NuGet.org
        run: |
          dotnet nuget push "${{ steps.pack.outputs.PACKAGED_FILE }}" \
            --source https://api.nuget.org/v3/index.json \
            --api-key ${{ secrets.NUGET_API_KEY }} \
            --skip-duplicate

      - name: Attach package to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.pack.outputs.PACKAGED_FILE }}
          name: ${{ github.event.release.name }}
          body: ${{ github.event.release.body }}
          token: ${{ secrets.GITHUB_TOKEN }}