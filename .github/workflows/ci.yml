# .github/workflows/ci.yml
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [staging]

jobs:
  ci:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read

    strategy:
      matrix:
        dotnet-version: ['10.0.x']

    steps:
      - name: 🔁 Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: ⚙️ Setup .NET ${{ matrix.dotnet-version }}
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ matrix.dotnet-version }}
          cache: false

      - name: 🔚 Shutdown build server
        run: dotnet build-server shutdown || true

      - name: 💾 Cache NuGet packages
        uses: actions/cache@v5
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/packages.lock.json') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: 🧹 Pre-clean FSharp.Core after cache
        run: |
          echo "🧹 Removing FSharp.Core from NuGet cache"
          rm -rf ~/.nuget/packages/fsharp.core

      - name: 🔧 Restore dependencies with lock file
        run: |
          echo "📦 Restoring main and test projects"
          dotnet restore src/MoneyToWords/MoneyToWords.fsproj --use-lock-file --locked-mode
          dotnet restore tests/MoneyToWords.Tests/MoneyToWords.Tests.fsproj --use-lock-file --locked-mode

      # ... остальные шаги без изменений ...
      - name: 🔨 Build library
        run: |
          echo "🔨 Building MoneyToWords..."
          dotnet build src/MoneyToWords/MoneyToWords.fsproj \
            --configuration Release \
            --no-incremental \
            --no-restore

      - name: 🎨 Check code format
        run: |
          echo "🔍 Verifying code formatting (dotnet format)"
          if ! command -v dotnet-format >/dev/null 2>&1; then
            echo "⚠️ Installing dotnet-format..."
            dotnet tool install --global dotnet-format || dotnet tool update --global dotnet-format
            export PATH="$HOME/.dotnet/tools:$PATH"
          fi
          dotnet format --verify-no-changes

      - name: 🔎 Check README install command
        run: |
          echo "🔍 Ensuring README contains correct install command"
          if ! grep -q "dotnet add package MoneyToWordsFSharpLib" README.md; then
            echo "❌ README.md must contain 'dotnet add package MoneyToWordsFSharpLib'"
            exit 1
          fi

      - name: 🔎 F# Lint (FSharpLint)
        run: |
          echo "🔍 Installing and running F# lint"
          dotnet tool install --global dotnet-fsharplint || dotnet tool update --global dotnet-fsharplint
          export PATH="$HOME/.dotnet/tools:$PATH"
          mkdir -p TestResults
          dotnet-fsharplint lint --format msbuild --file-type project src/MoneyToWords/MoneyToWords.fsproj > TestResults/fsharplint.msbuild || true
          dotnet-fsharplint lint --file-type project src/MoneyToWords/MoneyToWords.fsproj

      - name: 📄 Upload fsharplint report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: fsharplint-report
          path: TestResults/fsharplint.msbuild

      - name: 🔄 Convert fsharplint report to SARIF
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "🔧 Converting fsharplint report to SARIF"
          dotnet tool install --global Sarif.Multitool || dotnet tool update --global Sarif.Multitool || true
          export PATH="$HOME/.dotnet/tools:$PATH"
          SARIF_OUT=TestResults/fsharplint.sarif

          if sarif --help 2>/dev/null | grep -q "convert"; then
            sarif convert --input TestResults/fsharplint.msbuild --output $SARIF_OUT 2>/dev/null || true
          elif sarif --help 2>/dev/null | grep -q "transform"; then
            sarif transform TestResults/fsharplint.msbuild $SARIF_OUT 2>/dev/null || true
          else
            echo "⚠️ 'sarif' tool not available; skipping"
          fi

          if [ -f "$SARIF_OUT" ]; then
            echo "📤 Uploading SARIF to Code Scanning"
            SARIF_CONTENT=$(python -c "import json; print(json.dumps(open('$SARIF_OUT', 'r').read()))")
            DATA=$(printf '{"commit_sha":"%s","ref":"%s","sarif":%s}' "${{ github.sha }}" "${{ github.ref }}" "$SARIF_CONTENT")
            curl -s -S -H "Authorization: token $GITHUB_TOKEN" -H "Content-Type: application/json" -d "$DATA" "https://api.github.com/repos/${{ github.repository }}/code-scanning/sarifs" || true
          fi

      - name: 🔐 Check for vulnerable packages
        run: |
          echo "🔍 Checking for vulnerable packages"
          dotnet list package --vulnerable > vulnerabilities.txt 2>&1 || true

          if grep -q "No vulnerable packages were found\|has no vulnerable packages" vulnerabilities.txt; then
            echo "✅ No known vulnerabilities"
          elif grep -q "error" vulnerabilities.txt; then
            echo "❌ Error in vulnerability check:"
            cat vulnerabilities.txt
            exit 1
          elif [ -s vulnerabilities.txt ]; then
            echo "❌ Vulnerable packages found:"
            cat vulnerabilities.txt
            exit 1
          else
            echo "⚠️ Empty output — skipping"
          fi

      - name: 🏷️ Log resolved version (MinVer)
        run: |
          echo "🔍 Triggering MinVer..."
          dotnet build src/MoneyToWords/MoneyToWords.fsproj \
            --configuration Release \
            --no-incremental \
            --no-dependencies \
            /p:GeneratePackageOnBuild=false

          VERSION=$(dotnet msbuild -nologo -getProperty:PackageVersion src/MoneyToWords/MoneyToWords.fsproj)
          echo "📦 Version: $VERSION"
          echo "PACKAGE_VERSION=$VERSION" >> $GITHUB_ENV

      - name: 🧪 Run TextOutput tests
        run: |
          echo "🧪 Running TextOutput tests"
          mkdir -p TestResults
          dotnet test tests/MoneyToWords.Tests/MoneyToWords.Tests.fsproj --configuration Release --filter "FullyQualifiedName~TextOutput" --logger "trx;LogFileName=${{ github.workspace }}/TestResults/textoutput.trx"

      - name: 🧪 Run tests & collect coverage
        run: |
          echo "🧪 Running all tests"
          mkdir -p TestResults
          dotnet test tests/MoneyToWords.Tests/MoneyToWords.Tests.fsproj --configuration Release --verbosity normal --logger "trx;LogFileName=${{ github.workspace }}/TestResults/results.trx" /p:CollectCoverage=true /p:CoverletOutputFormat=cobertura /p:CoverletOutput=${{ github.workspace }}/TestResults/coverage.cobertura.xml /p:Threshold=85 /p:ThresholdType=line /p:ThresholdStat=total

      - name: 📤 Upload test results (on failure)
        if: always() && github.event_name == 'pull_request'
        uses: actions/upload-artifact@v6
        with:
          name: test-results
          path: TestResults/results.trx
          retention-days: 5

      - name: 📊 Upload coverage to Codecov
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
        if: github.event_name == 'pull_request' && env.CODECOV_TOKEN != ''
        uses: codecov/codecov-action@v4
        with:
          token: ${{ env.CODECOV_TOKEN }}
          files: TestResults/coverage.cobertura.xml
          flags: unittests
          fail_ci_if_error: false
          verbose: true

      - name: 📦 Validate package (PR only)
        if: github.event_name == 'pull_request'
        run: |
          echo "📦 Validating package"
          dotnet pack src/MoneyToWords/MoneyToWords.fsproj \
            --configuration Release \
            --no-build \
            --output ./artifacts \
            /p:IncludeSymbols=true \
            /p:SymbolPackageFormat=snupkg \
            /p:ContinuousIntegrationBuild=true \
            /p:NoWarn=NU5128

          dotnet msbuild -nologo -getProperty:PackageVersion /p:DesignTimeBuild=true src/MoneyToWords/MoneyToWords.fsproj
          ls -la ./artifacts/

      - name: 📤 Upload validated package
        if: github.event_name == 'pull_request' && success()
        uses: actions/upload-artifact@v6
        with:
          name: validated-package
          path: ./artifacts/*.nupkg
          retention-days: 5

  # ===================================================================
  # Проверка лейблов
  # ===================================================================
  validate-pr:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    needs: ci
    permissions:
      contents: read
      pull-requests: read
      issues: write

    steps:
      - name: 🔁 Checkout code
        uses: actions/checkout@v6

      - name: ⚙️ Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: 📦 Restore tools
        run: |
          dotnet tool restore

      - name: 🧹 Lint F# scripts
        run: |
          dotnet fsharplint lint .github/scripts/*.fsx

      - name: 🔐 Setup GitHub CLI
        run: |
          echo "🔐 Using GH_TOKEN"
          gh auth status
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}

      - name: 🔄 Run sync-labels.fsx
        run: |
          echo "🔁 Running sync-labels..."
          dotnet fsi .github/scripts/sync-labels.fsx --apply
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          PR_NUMBER: ${{ github.event.number }}

      - name: 🏷️ Apply automatic labels
        uses: actions/labeler@v6
        with:
          repo-token: ${{ secrets.GH_PAT }}
          configuration-path: .github/labeler.yml
          sync-labels: false
          dot: true

  # ===================================================================
  # Публикация
  # ===================================================================
  publish:
    if: github.event_name == 'release' && github.event.action == 'published'
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write

    steps:
      - name: 🔁 Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: ⚙️ Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: 🧹 Pre-clean FSharp.Core (fix NU1403)
        run: |
          echo "🧹 Cleaning FSharp.Core from cache"
          rm -rf ~/.nuget/packages/fsharp.core

      - name: 💾 Cache NuGet packages
        uses: actions/cache@v5
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/packages.lock.json') }}

      - name: 🔧 Restore and Build
        run: |
          echo "📦 Restoring with lock file"
          dotnet restore --use-lock-file --locked-mode
          dotnet build src/MoneyToWords/MoneyToWords.fsproj \
            --configuration Release \
            /p:RepositoryUrl=https://github.com/DivinMA/MoneyToWords \
            /bl:build.binlog

      - name: 📦 Pack with MinVer
        id: pack
        run: |
          dotnet pack src/MoneyToWords/MoneyToWords.fsproj \
            --configuration Release \
            --output ./artifacts \
            /p:IncludeSymbols=true \
            /p:SymbolPackageFormat=snupkg \
            /p:ContinuousIntegrationBuild=true

      - name: ✅ Verify package version
        run: |
          echo "📦 Final version:"
          dotnet msbuild -nologo -getProperty:PackageVersion
          ls -la ./artifacts/
          find ./artifacts -name "*.nupkg" -exec echo "✅ Created package:" {} \;

      - name: Publish to NuGet.org
        run: |
          dotnet nuget push "./artifacts/*.nupkg" \
            --source https://api.nuget.org/v3/index.json \
            --api-key ${{ secrets.NUGET_API_KEY }} \
            --skip-duplicate

      - name: Attach package to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: ./artifacts/*.nupkg
          token: ${{ secrets.GITHUB_TOKEN }}
