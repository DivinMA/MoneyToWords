name: CI/CD

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  release:
    types: [ published ]

jobs:
  # ===================================================================
  # 1. СБОРКА (Build) — всегда
  # ===================================================================
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read

    strategy:
      matrix:
        dotnet-version: ['10.0.x']

    # ✅ ВАЖНО: передаём dotnet-version в другие job'ы
    outputs:
      dotnet-version: ${{ matrix.dotnet-version }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup .NET ${{ matrix.dotnet-version }}
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ matrix.dotnet-version }}
          cache: false

      - name: Cache NuGet packages
        uses: actions/cache@v5
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/packages.lock.json') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Remove packages.lock.json (preview workaround)
        run: |
          find . -name "packages.lock.json" -type f -delete || true

      - name: Restore dependencies
        run: |
          echo "📄 Found project files:"
          find . -name "*.fsproj" -type f -exec ls -la {} \;
          echo "📦 Running dotnet restore --force-evaluate"
          dotnet restore --force-evaluate

      - name: Build project
        run: |
          dotnet build src/MoneyToWords/MoneyToWords.fsproj \
            --configuration Release \
            --no-incremental \
            --no-restore

      - name: Find built DLL (debug)
        run: |
          echo "🔍 Searching for MoneyToWords.dll..."
          find . -name "MoneyToWords.dll" -exec ls -la {} \;

      - name: Upload Artifacts
        uses: actions/upload-artifact@v6
        with:
          name: built-artifacts-${{ matrix.dotnet-version }}
          path: |
            bin/Release/
            obj/*/Release/
          retention-days: 5
          if-no-files-found: error


  # ===================================================================
  # 2. ТЕСТИРОВАНИЕ (Test) — после успешной сборки
  # ===================================================================
  test:
    needs: build
    runs-on: ubuntu-latest

    # ✅ Передаём dotnet-version дальше, если pack-validation зависит от test
    outputs:
      dotnet-version: ${{ needs.build.outputs.dotnet-version }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Download built artifacts
        uses: actions/download-artifact@v4
        with:
          name: built-artifacts-${{ needs.build.outputs.dotnet-version }}
          path: src/MoneyToWords/

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
          cache: false

      - name: Cache NuGet packages
        uses: actions/cache@v5
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/packages.lock.json') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Run tests
        run: |
          echo "🔍 Current directory: $(pwd)"
          echo "📄 Project file:"
          ls -la src/MoneyToWords/MoneyToWords.fsproj
          echo "🧪 Running tests..."
          mkdir -p TestResults
          dotnet test src/MoneyToWords/MoneyToWords.fsproj \
            --configuration Release \
            --no-build \
            --verbosity normal \
            --logger "trx;LogFileName=${{ github.workspace }}/TestResults/results.trx"
          echo "📄 Test results generated:"
          ls -la TestResults/
          

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: test-results
          path: TestResults/results.trx
          retention-days: 5


  # ===================================================================
  # 3. ПАКОВКА ДЛЯ ПРОВЕРКИ (Pack Validation) — только в PR
  # ===================================================================
  pack-validation:
    if: github.event_name == 'pull_request'
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Download built artifacts
        uses: actions/download-artifact@v4
        with:
          # ✅ Теперь работает: test передаёт dotnet-version
          name: built-artifacts-${{ needs.test.outputs.dotnet-version }}
          path: ./

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
          cache: false

      - name: Cache NuGet packages
        uses: actions/cache@v5
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/packages.lock.json') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore dependencies (for pack)
        run: |
          echo "🔧 Restoring packages to generate project.assets.json"
          dotnet restore src/MoneyToWords/MoneyToWords.fsproj --force-evaluate

      - name: Pack for validation
        run: |
          echo "📦 Validating package structure"
          dotnet pack src/MoneyToWords/MoneyToWords.fsproj \
            --configuration Release \
            --no-build \
            --output ./artifacts \
            /p:IncludeSymbols=true \
            /p:SymbolPackageFormat=snupkg \
            /p:ContinuousIntegrationBuild=true \
            /p:NoWarn=NU5128

      - name: List created packages
        run: |
          ls -la ./artifacts/

      - name: Upload NuPkg artifact
        uses: actions/upload-artifact@v6
        with:
          name: validated-package
          path: ./artifacts/*.nupkg
          if-no-files-found: warn


  # ===================================================================
  # 4. ПУБЛИКАЦИЯ (Publish) — только при публикации релиза
  # ===================================================================
  publish:
    if: github.event_name == 'release' && github.event.action == 'published'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
          cache: false

      - name: Cache NuGet packages
        uses: actions/cache@v5
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/packages.lock.json') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Remove packages.lock.json (workaround for NU1403)
        run: |
          find . -name "packages.lock.json" -type f -delete || true

      - name: Restore dependencies (force)
        run: dotnet restore --force-evaluate

      - name: Pack with MinVer
        id: pack
        run: |
          dotnet pack src/MoneyToWords/MoneyToWords.fsproj \
            --configuration Release \
            --no-restore \
            --output ./artifacts \
            /p:IncludeSymbols=true \
            /p:SymbolPackageFormat=snupkg

          NUPKG_FILE=$(find ./artifacts -name "*.nupkg" -type f -print -quit)
          echo "PACKAGED_FILE=$NUPKG_FILE" >> $GITHUB_OUTPUT
          echo "PACKAGED_FILENAME=$(basename $NUPKG_FILE)" >> $GITHUB_OUTPUT

      - name: Publish to NuGet.org
        run: |
          dotnet nuget push "${{ steps.pack.outputs.PACKAGED_FILE }}" \
            --source https://api.nuget.org/v3/index.json \
            --api-key ${{ secrets.NUGET_API_KEY }} \
            --skip-duplicate

      - name: Attach package to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.pack.outputs.PACKAGED_FILE }}
          name: ${{ github.event.release.name }}
          body: ${{ github.event.release.body }}
          token: ${{ secrets.GITHUB_TOKEN }}