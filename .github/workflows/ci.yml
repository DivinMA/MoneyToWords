name: CI/CD

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  release:
    types: [ published ]

jobs:
  # 1. Сборка и тесты
  build-and-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    strategy:
      matrix:
        dotnet-version: ['10.0.x']

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # 🔥 Для MinVer и release-drafter

      - name: Setup .NET
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: ${{ matrix.dotnet-version }}

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration Release --no-restore

      - name: Test
        run: dotnet test --no-build --configuration Release --verbosity normal

  # 2. Pack & Publish (только при релизе)
  publish:
    if: github.event_name == 'release' && github.event.action == 'published'
    needs: build-and-test
    runs-on: ubuntu-latest
    permissions:
      contents: write  # Для загрузки в GitHub Release
      id-token: write  # Для публикации в NuGet (если используешь OIDC)

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore

      - name: Pack with MinVer
        id: pack
        run: |
          echo "🔍 Tag: ${{ github.event.release.tag_name }}"
          echo "🔖 MinVer будет использовать тег для версии"

          dotnet pack src/MoneyToWords/MoneyToWords.fsproj \
            --configuration Release \
            --no-restore \
            --output ./artifacts \
            /p:IncludeSymbols=true \
            /p:SymbolPackageFormat=snupkg

          # Найдём .nupkg и сохраним путь
          NUPKG_FILE=$(find ./artifacts -name "*.nupkg" -type f | head -n 1)
          echo "PACKAGED_FILE=$NUPKG_FILE" >> $GITHUB_OUTPUT
          echo "PACKAGED_FILENAME=$(basename $NUPKG_FILE)" >> $GITHUB_OUTPUT

          ls -la ./artifacts/

      - name: Publish to NuGet.org
        run: |
          dotnet nuget push "${{ steps.pack.outputs.PACKAGED_FILE }}" \
            --source https://api.nuget.org/v3/index.json \
            --api-key ${{ secrets.NUGET_API_KEY }} \
            --skip-duplicate

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: ${{ steps.pack.outputs.PACKAGED_FILE }}
          name: ${{ github.event.release.name }}
          body: ${{ github.event.release.body }}
          token: ${{ secrets.GITHUB_TOKEN }}