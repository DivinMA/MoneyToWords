# .github/workflows/labeler.yml
name: Auto Label

on:
  pull_request_target:
    types: [opened, reopened, synchronize]
    branches: [main, staging]

jobs:
  label:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/labeler@v6
        with:
          configuration-path: .github/labeler.yml
          repo-token: ${{ secrets.GITHUB_TOKEN }}
