name: Auto Label PRs

on:
  pull_request:
    types: [opened, reopened, synchronize]
    branches: [ main, staging ]

jobs:
  label:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write  # ← Ключево!

    steps:
      - name: 🏷️ Apply labels
        uses: actions/labeler@v6
        with:
          configuration-path: .github/labeler.yml
          repo-token: ${{ secrets.GITHUB_TOKEN }}
