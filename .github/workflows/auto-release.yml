name: "Auto Release on main"

on:
  push:
    branches: [ main ]

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  create-release:
    runs-on: ubuntu-latest
    steps:
      - name: 🔁 Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: ⚙️ Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: 🔧 Restore
        run: dotnet restore --force-evaluate

      - name: 🔖 Resolve MinVer version
        id: version
        run: |
          # Get MinVerVersion from the project
          VERSION=$(dotnet msbuild -nologo -getProperty:MinVerVersion -p:Configuration=Release src/MoneyToWords/MoneyToWords.fsproj | sed -n 's/.*MinVerVersion:\s*\(.*\)/\1/p' | tr -d '\r')
          if [ -z "$VERSION" ]; then
            echo "::error::Could not resolve MinVerVersion"
            exit 1
          fi
          echo "Resolved version: $VERSION"
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: 🔍 Check existing release
        id: check_release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG=v${{ steps.version.outputs.version }}
          echo "Checking release for tag $TAG"
          gh auth login --with-token <<<"${GITHUB_TOKEN}"
          gh release view $TAG --repo $GITHUB_REPOSITORY --json draft --jq .draft > release_draft.txt 2>/dev/null || echo "not-found" > release_draft.txt
          cat release_draft.txt
          if grep -q "not-found" release_draft.txt; then
            echo "release_exists=false" >> $GITHUB_OUTPUT
          else
            DRAFT=$(cat release_draft.txt | tr -d '\n' | tr -d '\r')
            echo "release_exists=true" >> $GITHUB_OUTPUT
            echo "release_draft=$DRAFT" >> $GITHUB_OUTPUT
          fi

      - name: 🏷️ Create tag if missing
        if: steps.check_release.outputs.release_exists == 'false'
        run: |
          TAG=v${{ steps.version.outputs.version }}
          echo "Creating annotated tag $TAG and pushing to origin"
          git tag -a "$TAG" -m "Release $TAG"
          git push origin "$TAG"

      - name: 📣 Publish draft or create release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG=v${{ steps.version.outputs.version }}
          echo "Ensuring release for $TAG"
          gh auth login --with-token <<<"${GITHUB_TOKEN}"

          # If a draft exists for this tag, publish it
          if gh release view $TAG --repo $GITHUB_REPOSITORY --json draft --jq .draft >/dev/null 2>&1; then
            DRAFT=$(gh release view $TAG --repo $GITHUB_REPOSITORY --json draft --jq .draft)
            if [ "$DRAFT" = "true" ]; then
              echo "Publishing existing draft $TAG"
              gh release edit $TAG --repo $GITHUB_REPOSITORY --draft=false
              exit 0
            fi
          fi

          # Otherwise create a release with generated notes (GitHub's notes generator)
          if ! gh release view $TAG --repo $GITHUB_REPOSITORY >/dev/null 2>&1; then
            echo "Creating release $TAG with generated notes"
            gh release create $TAG --repo $GITHUB_REPOSITORY --generate-notes --title "$TAG"
          else
            echo "Release $TAG already exists and is published"
          fi
