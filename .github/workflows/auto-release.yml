name: "Auto Release on main"

on:
  workflow_run:
    workflows: ["Release Drafter"]
    types:
      - completed

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  create-release:
    runs-on: ubuntu-latest
    steps:
      - name: 🔁 Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: ⚙️ Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: 💾 Cache NuGet packages
        uses: actions/cache@v5
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/packages.lock.json') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: 🔧 Restore dependencies
        run: dotnet restore --force-evaluate

      - name: 🏷️ Resolve version via MinVer (build trigger)
        id: version
        run: |
          echo "🔍 Building to trigger MinVer..."
          dotnet build src/MoneyToWords/MoneyToWords.fsproj \
            --configuration Release \
            --no-incremental \
            --no-dependencies \
            /p:DesignTimeBuild=true \
            /p:ContinuousIntegrationBuild=true

          # Теперь MinVer сработал — получаем версию
          VERSION=$(dotnet msbuild -nologo -getProperty:PackageVersion /p:DesignTimeBuild=true src/MoneyToWords/MoneyToWords.fsproj | tr -d '\r')
          
          if [ -z "$VERSION" ]; then
            echo "::error::Could not resolve PackageVersion"
            exit 1
          fi

          echo "📦 Resolved version: $VERSION"
          echo "version=$VERSION" >> $GITHUB_OUTPUT
        shell: bash

      - name: 🔍 Check existing release
        id: check_release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v${{ steps.version.outputs.version }}"
          echo "Checking release for tag: $TAG"
          gh auth login --with-token <<< "${GITHUB_TOKEN}" || exit 1

          # Проверяем, существует ли релиз
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json draft --jq .draft > /dev/null 2>&1; then
            DRAFT=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json draft --jq .draft)
            echo "release_exists=true" >> $GITHUB_OUTPUT
            echo "release_draft=$DRAFT" >> $GITHUB_OUTPUT
          else
            echo "release_exists=false" >> $GITHUB_OUTPUT
          fi

      - name: 🏷️ Create tag if missing
        if: steps.check_release.outputs.release_exists == 'false'
        run: |
          TAG="v${{ steps.version.outputs.version }}"
          echo "Creating annotated tag: $TAG"
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git tag -a "$TAG" -m "Release $TAG"
          git push origin "$TAG"

      - name: 📣 Publish draft or create release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v${{ steps.version.outputs.version }}"
          gh auth login --with-token <<< "${GITHUB_TOKEN}" || exit 1

          # Если черновик существует — публикуем
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json draft --jq .draft > /dev/null 2>&1; then
            DRAFT=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json draft --jq .draft)
            if [ "$DRAFT" = "true" ]; then
              echo "Publishing draft release: $TAG"
              gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false
              exit 0
            fi
          fi

          # Если релиза нет — создаём с автозаметками
          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "Creating release with auto-generated notes: $TAG"
            gh release create "$TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --generate-notes \
              --title "$TAG"
          else
            echo "Release $TAG already exists and is published."
          fi
