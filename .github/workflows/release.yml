name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    environment: release

    steps:
      - name: 🔁 Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: ⚙️ Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: 🔚 Shutdown build server
        run: dotnet build-server shutdown || true

      - name: 💾 Cache NuGet packages
        uses: actions/cache@v5
        with:
          path: |
            ~/.nuget/packages
            ~/.nuget/packages/.tools
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/packages.lock.json') }}

      - name: 🧹 Pre-clean FSharp.Core
        run: |
          rm -rf ~/.nuget/packages/fsharp.core

      - name: 🔧 Restore
        run: dotnet restore --use-lock-file --disable-parallel

      - name: 🏷️ Resolve version
        id: version
        run: |
          VERSION=$(dotnet msbuild -nologo -getProperty:PackageVersion /p:DesignTimeBuild=true src/MoneyToWords/MoneyToWords.fsproj | tr -d '\r')
          echo "version=$VERSION" >> $GITHUB_OUTPUT
        shell: bash

      - name: "🔍 Debug: Show resolved version"
        run: |
          echo "Resolved version: ${{ steps.version.outputs.version }}"

      - name: 🔨 Build & Pack
        run: |
          dotnet build src/MoneyToWords/MoneyToWords.fsproj \
            --configuration Release \
            --no-incremental \
            --no-restore
          dotnet pack src/MoneyToWords/MoneyToWords.fsproj \
            --configuration Release \
            --no-build \
            --output ./artifacts
          ls -la ./artifacts/

      - name: 📦 Publish to NuGet
        if: github.event_name == 'push'
        run: |
          dotnet nuget push ./artifacts/*.nupkg \
            --source https://api.nuget.org/v3/index.json \
            --api-key ${{ secrets.NUGET_API_KEY }} \
            --skip-duplicate
          ls -la ./artifacts/

      # ❌ Удалён шаг загрузки ассета, так как в релизе нет загруженных ассетов
      # ❌ Дублирует публикацию на NuGet
      # ❌ Может падать, если релиз не создан
      # Оставлена только публикация на NuGet

