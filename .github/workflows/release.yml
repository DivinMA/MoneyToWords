name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    environment: release

    steps:
      - name: 🔁 Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: ⚙️ Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: 🔚 Shutdown build server
        run: dotnet build-server shutdown || true

      - name: 💾 Cache NuGet packages
        uses: actions/cache@v5
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/packages.lock.json') }}

      - name: 🧹 Pre-clean FSharp.Core
        run: |
          rm -rf ~/.nuget/packages/fsharp.core

      - name: 🔧 Restore
        run: dotnet restore --use-lock-file

      - name: 🏷️ Resolve version
        id: version
        run: |
          VERSION=$(dotnet msbuild -nologo -getProperty:PackageVersion /p:DesignTimeBuild=true src/MoneyToWords/MoneyToWords.fsproj | tr -d '\r')
          echo "version=$VERSION" >> $GITHUB_OUTPUT
        shell: bash

      - name: "🔍 Debug: Show resolved version"
        run: |
          echo "Resolved version: ${{ steps.version.outputs.version }}"

      - name: 🔨 Build & Pack
        run: |
          dotnet build src/MoneyToWords/MoneyToWords.fsproj \
            --configuration Release \
            --no-incremental \
            --no-restore
          dotnet pack src/MoneyToWords/MoneyToWords.fsproj \
            --configuration Release \
            --no-build \
            --output ./artifacts

      - name: 📦 Publish to NuGet
        run: |
          dotnet nuget push ./artifacts/*.nupkg \
            --source https://api.nuget.org/v3/index.json \
            --api-key ${{ secrets.NUGET_API_KEY }} \
            --skip-duplicate
          ls ./artifacts/

      - name: 📂 Upload release asset
        if: success()
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ github.event.repository.releases[0].upload_url }}
          asset_path: ./artifacts/MoneyToWordsFSharpLib.${{ steps.version.outputs.version }}.nupkg
          asset_name: MoneyToWordsFSharpLib.${{ steps.version.outputs.version }}.nupkg
          asset_content_type: application/octet-stream
