name: Sync Labels

on:
  schedule:
    - cron: '0 4 * * mon'
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - run: dotnet fsi .github/scripts/sync-labels.fsx --apply
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
