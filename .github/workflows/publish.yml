name: 🚀 Publish NuGet Package

# Запускается ТОЛЬКО при публикации релиза
on:
  release:
    types: [published]

jobs:
  publish:
    # Гарантируем: только из main
    if: github.event.release.target_commitish == 'main'
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
      id-token: write  # Для сборки с идентификацией

    steps:
      - name: 🔁 Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0  # Критично для MinVer

      - name: ⚙️ Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: 💾 Cache NuGet packages
        uses: actions/cache@v5
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/packages.lock.json') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: 🧹 Remove packages.lock.json (workaround)
        run: |
          find . -name "packages.lock.json" -type f -delete || true

      - name: 🛰️ Fetch all tags
        run: |
          git fetch --prune --tags
          echo "📦 Available tags:"
          git tag --list --sort=-version:refname | head -10

      - name: 🔧 Restore dependencies
        run: |
          dotnet restore --force-evaluate

      - name: 🔨 Build project
        run: |
          dotnet build src/MoneyToWords/MoneyToWords.fsproj \
            --configuration Release \
            /p:RepositoryUrl=https://github.com/DivinMA/MoneyToWords \
            /bl:build.binlog

      - name: 📦 Pack with MinVer
        run: |
          dotnet pack src/MoneyToWords/MoneyToWords.fsproj \
            --configuration Release \
            --output ./artifacts \
            /p:IncludeSymbols=true \
            /p:SymbolPackageFormat=snupkg \
            /p:ContinuousIntegrationBuild=true

      - name: ✅ Verify package version
        run: |
          echo "🔖 Final PackageVersion:"
          dotnet msbuild -nologo -getProperty:PackageVersion
          ls -la ./artifacts/
          find ./artifacts -name "*.nupkg" -exec echo "✅ Created package:" {} \;

      - name: 🔧 Validate package contents
        run: |
          echo "🔍 Validating .nupkg contents"
          set -e
          NUPKG=$(ls ./artifacts/*.nupkg | head -n1)
          if [ -z "$NUPKG" ]; then
            echo "::error::No nupkg found in ./artifacts"
            exit 1
          fi
          echo "Found: $NUPKG"
          echo "Contents:" && unzip -l "$NUPKG"

          # Ensure library DLL is present
          if ! unzip -l "$NUPKG" | grep -q "lib/net10.0/MoneyToWords.dll"; then
            echo "::error::Library DLL not found inside nupkg"
            exit 1
          fi

          # Ensure README and LICENSE bundled
          if ! unzip -l "$NUPKG" | grep -q "README.md"; then
            echo "::error::README.md not included in package"
            exit 1
          fi

          if ! unzip -l "$NUPKG" | grep -q "LICENSE.txt"; then
            echo "::error::LICENSE.txt not included in package"
            exit 1
          fi

          # Create checksums
          sha512sum ./artifacts/*.nupkg > ./artifacts/checksums.sha512
          ls -la ./artifacts/checksums.sha512

      - name: Publish to NuGet.org
        run: |
          if [ -z "${{ secrets.NUGET_API_KEY }}" ]; then
            echo "::error::NUGET_API_KEY secret is not set. Configure it in repository secrets to allow publishing to NuGet.org"
            exit 1
          fi

          dotnet nuget push "./artifacts/*.nupkg" \
            --source https://api.nuget.org/v3/index.json \
            --api-key ${{ secrets.NUGET_API_KEY }} \
            --skip-duplicate

      - name: Attach package to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: ./artifacts/*.nupkg
          token: ${{ secrets.GITHUB_TOKEN }}
