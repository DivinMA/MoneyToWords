name: "Check Branch & Environment Protection"

on:
  schedule:
    - cron: '0 5 * * mon'
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write

jobs:
  check-protection:
    runs-on: ubuntu-latest
    steps:
      - name: 🔁 Checkout
        uses: actions/checkout@v6

      - name: 🔐 Check branch protection for main
        run: |
          echo "Checking branch protection for 'main'"
          gh api repos/${{ github.repository }}/branches/main/protection --jq '.' > branch_protection.json || true
          if [ ! -s branch_protection.json ]; then
            echo "::error::Branch protection for 'main' not configured"
            gh issue create --title "CI: Missing branch protection for main" --body "Branch protection for 'main' is not configured or API returned empty. Please ensure required status checks, require pull requests, and require linear history / squash merges as desired." || true
            exit 1
          fi
          echo "Branch protection present"

      - name: 🔐 Check environment protection for 'release'
        run: |
          echo "Checking environment 'release' protection"
          gh api repos/${{ github.repository }}/environments/release --jq '.' > env_release.json || true
          if [ ! -s env_release.json ]; then
            echo "::warning::Environment 'release' not configured. Please create an environment named 'release' and add required reviewers to protect publish step."
            gh issue create --title "CI: Missing 'release' environment" --body "Create GitHub Actions environment 'release' and add required reviewers (release managers). This will enforce approval before publishing packages to NuGet." || true
          else
            echo "Environment 'release' exists"
          fi
